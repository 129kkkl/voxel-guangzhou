<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>体素广州 · 新中轴 | Voxel Guangzhou Central Axis</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #070a14; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 16px; left: 16px; z-index: 10;
        color: #e8e4da; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        background: rgba(8, 12, 28, 0.62); padding: 12px 16px;
        border-radius: 10px; backdrop-filter: blur(6px);
        pointer-events: none; border: 1px solid rgba(120, 220, 255, 0.12);
        max-width: 360px;
      }
      #hud h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: 3px; font-weight: 600; color: #9ae6ff; }
      #hud p { margin: 2px 0; font-size: 12px; opacity: 0.8; }
      #stats { color: #ffd27a; font-variant-numeric: tabular-nums; }
      #status { color: #8f9bb3; }
      .hint { opacity: 0.55 !important; }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>体素广州 · 新中轴</h1>
      <p>Voxel Guangzhou — 珠江新城 · 广州塔核心区</p>
      <p class="hint">拖拽旋转 · 滚轮缩放 · 键盘 1–5 切镜 · 右上角控制台</p>
      <p id="status">加载中…</p>
      <p id="stats">—</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
